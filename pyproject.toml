[project]
name = "transimage"
version = "0.1.0"
description = "Cross-platform desktop shell for viewing one image at a time"
requires-python = ">=3.11"
dependencies = [
    "av>=18.1.0",
    "openrouter>=1.3.63",
    "pillow>=13.0.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
transimage = "transimage.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transimage"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
